# Kosh Site Configuration — Blog Theme Example
# Run 'kosh serve --dev' inside this example directory to preview.

title: "Kosh Developer Blog"
logo: "static/images/logo.png"
baseURL: ""
language: "en"

# Directory Structure
outputDir: "public"
contentDir: "content"
themeDir: "../.."
theme: "kosh-theme-blog"
cacheDir: ".kosh-cache"

# Content Customization
contentPrefix: "blogs"
itemsPerPage: 6
shouldCompressImages: true
imageWorkers: 8

navbar:
  home:
    title: "Kosh Dev"
    btnLabel: "Read Blog"
  section:
    title: "Kosh Deep Dives"
    btnLabel: "Return Home"
  homeBadge: "v2.0 Release"

taxonomies:
  tags: "tags"
  series: "series"
  events: "events"

menu:
  - name: "Search"
    id: "search-btn"
    class: "nav-btn"
  - name: "Tags"
    url: "/blogs/tags/"
  - name: "Graph"
    url: "/graph.html"

footerMenu:
  - name: "Home"
    url: "/"
  - name: "Blogs"
    url: "/blogs/"
  - name: "GitHub"
    url: "https://github.com/Kush-Singh-26/kosh"
    target: "_blank"
  - name: "RSS Feed"
    url: "/rss.xml"
    target: "_blank"

# Social Cards (Open Graph Images generated by Kosh)
socialCards:
  background: "#141816"    # Deep Inky Black
  gradient: []             # Classy solid look
  angle: 135
  textColor: "#e1e9e4"     # Scholar's Slate

features:
  useRawMarkdown: true     # Copy raw markdown to public/ for "View Source" feature
  generators:
    isSitemapEnabled: true
    isRSSEnabled: true
    isPWAEnabled: true
    search:
      isEnabled: true
      ranking:
        titleBoost: 50.0
        tagBoost: 10.0
        descriptionBoost: 5.0
        contentBoost: 0.05
        bm25K1: 1.2
        bm25b: 0.4
      endpoints:
        - "/search.bin"
    graph:
      isEnabled: true
      showsTaxonomies: true
